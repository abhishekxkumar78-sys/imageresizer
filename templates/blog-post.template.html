<body>
{{HEADER}}

    <!-- Article Content -->
    <main>
        <article class="blog-post-article">
            <a href="{{BLOG_ROOT}}" class="blog-post-nav-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                {{BACK_TO_BLOG_TEXT}}
            </a>

            <header class="blog-post-header">
                <span class="blog-card-badge">{{CATEGORY}}</span>
                <h1 class="blog-post-title">{{TITLE}}</h1>
                <div class="blog-post-meta">
                    <span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        {{DATE_FORMATTED}}
                    </span>
                    <span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        {{READING_TIME}}
                    </span>
                    <span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        {{AUTHOR}}
                    </span>
                </div>
            </header>

            <div class="blog-post-body">
{{CONTENT_HTML}}
            </div>

{{TOOL_CTA_BOX}}

{{RELATED_POSTS_SECTION}}
        </article>
    </main>

{{FOOTER}}

    <script>
    (function() {
        const hamburger = document.querySelector('.nav-hamburger');
        const nav = document.querySelector('.header-nav');
        if (!hamburger || !nav) return;

        function toggleMenu() {
            const isOpen = nav.classList.toggle('is-open');
            hamburger.setAttribute('aria-expanded', isOpen);
            document.body.style.overflow = isOpen ? 'hidden' : '';
        }

        function closeMenu() {
            nav.classList.remove('is-open');
            hamburger.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';
        }

        hamburger.addEventListener('click', toggleMenu);
        nav.querySelectorAll('a, span').forEach(link => {
            link.addEventListener('click', closeMenu);
        });
        document.addEventListener('click', (e) => {
            if (nav.classList.contains('is-open') && !nav.contains(e.target) && !hamburger.contains(e.target)) {
                closeMenu();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && nav.classList.contains('is-open')) closeMenu();
        });
    })();
    </script>
</body>

</html>
